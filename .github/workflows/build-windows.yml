name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4 scipy==1.12.0 astropy==6.1.3 photutils==1.13.0 matplotlib==3.9.2 pyinstaller

      - name: Check Python sources and imports
        run: |
          python -m py_compile Seestar_Double_Star_Analyzer_Basic_GUI.py photoanalyzer_basic.py duostar_annotation.py
          python -c "import photoanalyzer_basic, duostar_annotation; print('Core modules OK')"

      - name: Build one-file Windows EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name "Seestar Double Star Analyzer Basic" --hidden-import duostar_annotation --collect-all astropy --collect-all photutils --collect-all matplotlib Seestar_Double_Star_Analyzer_Basic_GUI.py

      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "dist\Seestar Double Star Analyzer Basic.exe" "release\Seestar Double Star Analyzer Basic.exe"
          Copy-Item "Seestar_wds.csv" "release\Seestar_wds.csv"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Seestar-Double-Star-Analyzer-Basic-Windows
          path: release/
