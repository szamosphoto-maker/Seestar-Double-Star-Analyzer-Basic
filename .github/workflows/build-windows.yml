name: Build DuoStar Basic Windows EXE

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 scipy==1.12.0 astropy==6.1.3 photutils==1.13.0 pyinstaller

      - name: Build one-file Windows EXE
        shell: cmd
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile ^
            --name "DuoStar Basic" ^
            --collect-all astropy ^
            --collect-all photutils ^
            DuoStar_Basic_GUI_EN.py

      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "dist\DuoStar Basic.exe" "release\DuoStar Basic.exe"
          Copy-Item "Seestar_wds.csv" "release\Seestar_wds.csv"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuoStar-Basic-Windows
          path: release
